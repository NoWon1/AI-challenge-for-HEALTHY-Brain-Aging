[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosaarthi-ad"
version = "0.3.0"
description = "Privacy-conscious multimodal longitudinal brain-ageing research platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "NeuroSaarthi-AD contributors"}]
keywords = ["brain-ageing", "neuroimaging", "longitudinal", "MONAI", "survival-analysis"]
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pyyaml>=6.0,<7",
]

[project.scripts]
neurosaarthi = "neurosaarthi.cli:main"

[project.optional-dependencies]
advanced = [
  "lightgbm>=4.6,<5",
  "scikit-survival>=0.25,<0.27",
  "shap>=0.48,<1",
  "optuna>=4.4,<5",
  "statsmodels>=0.14.5,<0.15",
  "lifelines>=0.30,<0.31",
]
imaging = [
  "nibabel==5.4.2",
  "scipy>=1.15,<2",
  "pydicom>=3.0,<4",
  "SimpleITK>=2.5,<3",
]
monai = [
  "torch==2.13.0",
  "monai==1.6.0",
  "nibabel==5.4.2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pygments>=2.19,<3",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "pandas-stubs>=2.2,<3",
  "types-PyYAML>=6.0,<7",
  "streamlit>=1.47,<2",
  "altair>=5.5,<6",
  "plotly>=6.2,<7",
]
dashboard = [
  "streamlit>=1.47,<2",
  "altair>=5.5,<6",
  "plotly>=6.2,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.setuptools.packages.find]
include = [
  "data_contracts*",
  "demo*",
  "etl*",
  "evaluation*",
  "features*",
  "harmonization*",
  "models*",
  "neurosaarthi*",
]

[tool.setuptools.package-data]
data_contracts = ["*.yaml"]
