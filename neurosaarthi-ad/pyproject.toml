[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosaarthi-ad"
version = "0.2.0"
description = "Multimodal dementia risk, progression, and twin-lite scaffold for the CBR Healthy Brain Aging AI Challenge."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
advanced = [
  "lightgbm>=4.0",
  "scikit-survival>=0.22",
  "shap>=0.43",
  "optuna>=3.4",
  "statsmodels>=0.14",
  "lifelines>=0.27",
]
dev = [
  "pytest>=7.0",
  "pygments>=2.17",
]
dashboard = [
  "streamlit>=1.30",
  "altair>=5.0",
  "plotly>=5.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = [
  "data_contracts*",
  "demo*",
  "etl*",
  "evaluation*",
  "features*",
  "harmonization*",
  "models*",
]
