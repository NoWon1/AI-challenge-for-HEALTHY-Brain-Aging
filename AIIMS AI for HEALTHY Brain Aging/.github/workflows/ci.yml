name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[advanced,dev,imaging]"
      - name: Lint
        run: |
          python -m ruff check neurosaarthi tests models/survival/rsf.py models/classification/lightgbm_risk.py evaluation/uncertainty.py
          python -m ruff format --check neurosaarthi tests models/survival/rsf.py models/classification/lightgbm_risk.py evaluation/uncertainty.py
      - name: Typecheck privacy and split core
        run: python -m mypy neurosaarthi/core neurosaarthi/security neurosaarthi/data/splitters
      - name: Test
        run: python -m pytest --cov=neurosaarthi --cov-report=term-missing
      - name: Build package
        run: python -m build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
